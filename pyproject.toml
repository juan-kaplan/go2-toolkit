[project]
name = "go2-toolkit"
version = "0.1.0"
description = "Drive a Unitree Go2 from Python, in a MuJoCo simulator and on the real robot, over the same DDS topics"
requires-python = "==3.10.*"
license = { text = "MIT" }

# numpy and mujoco are pinned because the golden trajectory files and the
# IK-against-FK test compare exact floats against them. cyclonedds is pinned
# because unitree_sdk2py pins it, and a mismatch there fails at import.
dependencies = [
    "numpy==2.2.6",
    "mujoco==3.12.0",
    "scipy>=1.15",
    "cyclonedds==0.10.2",
    "unitree_sdk2py",
    # Not used by this project. The unitree_mujoco bridge imports it at startup
    # even with the joystick off, so running the simulator needs it.
    "pygame==2.6.1",
]

[project.optional-dependencies]
# Only the tools that draw and the trial video renderer. The control path never
# needs them.
plots = ["matplotlib>=3.10", "opencv-python>=4.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# unitree_sdk2py is not on PyPI. tools/setup.sh clones it into third_party and it
# is installed from there, so the SDK source stays readable next to the code that
# uses it.
[tool.uv.sources]
unitree_sdk2py = { path = "third_party/unitree_sdk2_python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go2_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py310"
exclude = ["third_party"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
